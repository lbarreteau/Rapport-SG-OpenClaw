# À ajouter dans /config/secrets.yaml (valeurs d'exemple à remplacer).

# « Bearer » suivi du jeton hooks.token défini dans /config/.openclaw/openclaw.json.
openclaw_hooks_authorization: "Bearer remplacez-par-le-jeton-des-webhooks"

# Identifiant numérique de votre conversation Telegram avec le bot OpenClaw
# (pour une conversation privée, c'est votre identifiant utilisateur Telegram).
sg_report_telegram_chat_id: "123456789"
